# Netlify: static deployment of the pre-rendered site in site/.
#
#   python export_static.py      # regenerate site/ (needs Python + requirements)
#   netlify deploy --prod --dir site
#
# Netlify runs no Python, so the API responses are pre-computed into
# site/api/*.json by export_static.py; the dashboard reads them directly.

[build]
  publish = "site"
  command = ""

# B4 FIX: two separate Cloud Run services.
#
# /live-api  → snapshot service (high-concurrency, fast GCS reads).
#   Suitable for: /api/targets, /api/status, /api/refresh-status,
#   /api/dashboard?source=cache, /api/recovery?source=cache, /api/mosaic.
#   Netlify's 26-second proxy timeout is fine for these.
[[redirects]]
  from = "/live-api/*"
  to = "https://spherex-lens-api-m6cqoypnxa-uc.a.run.app/api/:splat"
  status = 200
  force = true

# /data-live-api  → live-pipeline service (concurrency=1).
#   Used only for the /api/refresh POST trigger (fast ack) and health checks.
#   SSE streams (/api/dashboard/stream, /api/field/stream, /api/recovery/stream)
#   must bypass Netlify entirely and use the direct Cloud Run URL because
#   Netlify times out after 26 seconds.
[[redirects]]
  from = "/data-live-api/*"
  to = "https://spherex-lens-live-m6cqoypnxa-uc.a.run.app/api/:splat"
  status = 200
  force = true

# Long-running IRSA jobs use the direct Cloud Run URL because Netlify proxy
# rewrites time out after 26 seconds. The static shell configures that base.

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/figures/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
